<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e2ba"/>
      <stop offset="40%" stop-color="#b89355"/>
      <stop offset="80%" stop-color="#8c6c38"/>
      <stop offset="100%" stop-color="#dfba73"/>
    </linearGradient>
    <linearGradient id="ringGold2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6b880"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#f0dbaf"/>
    </linearGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#554020" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Diamond on Bride's Ring -->
  <polygon points="46,12 50,5 54,12 50,18" fill="#eef7fa" stroke="#b89355" stroke-width="0.8" filter="url(#ringShadow)"/>
  <polygon points="48,10 50,7 52,10 50,14" fill="#ffffff"/>

  <!-- First Ring -->
  <ellipse cx="50" cy="42" rx="26" ry="24" fill="none" stroke="url(#ringGold1)" stroke-width="5" filter="url(#ringShadow)"/>
  
  <!-- Second Ring Intertwined -->
  <ellipse cx="70" cy="42" rx="26" ry="24" fill="none" stroke="url(#ringGold2)" stroke-width="5" filter="url(#ringShadow)"/>
  
  <!-- Overlap cut for authentic 3D interlock -->
  <path d="M57,21 A26,24 0 0 1 73,28" fill="none" stroke="url(#ringGold1)" stroke-width="5"/>
</svg>
